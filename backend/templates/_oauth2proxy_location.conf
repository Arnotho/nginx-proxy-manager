## OAuth2Proxy forward-auth endpoints
## Proxies the /oauth2/ paths (sign-in, callback) to the oauth2-proxy service.
location /oauth2/ {
  proxy_pass       {{ oauth2proxy_upstream_url }};
  proxy_set_header Host                    $host;
  proxy_set_header X-Real-IP               $remote_addr;
  # Redirect back to the originally requested URL after sign-in (multi-domain safe)
  proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
}

## Internal endpoint used by auth_request to validate the session.
## Marked `internal` so browsers cannot hit it directly (only nginx subrequests).
location = /oauth2/auth {
  internal;
  proxy_pass       {{ oauth2proxy_upstream_url }};
  proxy_set_header Host             $host;
  proxy_set_header X-Real-IP        $remote_addr;
  proxy_set_header X-Forwarded-Uri  $request_uri;
  # nginx auth_request includes headers but not body
  proxy_set_header Content-Length   "";
  proxy_pass_request_body           off;
}

## Named location for handling OAuth2 sign-in redirects
## This ensures the browser receives a proper 302 redirect that it will follow
location @oauth2_signin {
  return 302 /oauth2/sign_in?rd=$scheme://$host$request_uri;
}
